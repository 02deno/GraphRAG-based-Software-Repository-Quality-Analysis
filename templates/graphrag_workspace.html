<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG workspace</title>
    <style>
        :root {
            --sidebar-bg: #202123;
            --sidebar-hover: #2f3033;
            --sidebar-text: #ececf1;
            --sidebar-muted: #8e8ea0;
            --border: #e5e5e5;
            --main-bg: #ffffff;
            --user-bubble: #dcf8c6;
            --assistant-bg: #f4f4f5;
            --accent: #1a7f37;
            --warn: #b45309;
            --crit: #b91c1c;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--main-bg); color: #111; height: 100vh; display: flex; flex-direction: column; }
        .layout { display: flex; flex: 1; min-height: 0; }
        aside {
            width: 300px;
            min-width: 280px;
            max-width: min(340px, 40vw);
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f0f10;
            overflow-x: hidden;
        }
        aside header {
            padding: 14px 16px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.02em;
            border-bottom: 1px solid #3e3f42;
            background: #1a1b1e;
        }
        aside .nav-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 0 14px;
            scrollbar-width: thin;
            scrollbar-color: #5c5f66 #1a1b1e;
        }
        aside .nav-scroll::-webkit-scrollbar { width: 9px; }
        aside .nav-scroll::-webkit-scrollbar-track { background: #1a1b1e; border-radius: 8px; margin: 4px 0; }
        aside .nav-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6b6e76 0%, #4a4d54 100%);
            border-radius: 8px;
            border: 2px solid #1a1b1e;
        }
        aside .nav-scroll::-webkit-scrollbar-thumb:hover { background: #7c8088; }
        .nav-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9b9ba8;
            padding: 12px 14px 6px;
        }
        .project-group { margin-bottom: 4px; }
        .project-group-title {
            font-size: 12px;
            font-weight: 600;
            color: #d1d5db;
            padding: 8px 14px 4px;
            line-height: 1.35;
            word-break: break-word;
            hyphens: auto;
            border-left: 3px solid #3d4f3d;
            margin-left: 0;
        }
        .project-row {
            margin: 0 8px 3px 8px;
            padding: 9px 11px;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.03);
            min-width: 0;
        }
        .project-row:hover { background: rgba(255,255,255,0.08); border-color: #3e3f42; }
        .project-row.active {
            background: linear-gradient(135deg, #1e3a29 0%, #163422 100%);
            border-color: #22c55e;
            box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.25);
        }
        .project-row-primary {
            font-size: 13px;
            font-weight: 600;
            color: #f4f4f5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .project-row-date {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-row {
            margin: 0 8px 2px 8px;
            padding: 8px 11px 8px 14px;
            cursor: pointer;
            font-size: 12px;
            color: #c5c5d2;
            border-radius: 8px;
            border: 1px solid transparent;
            min-width: 0;
        }
        .session-row:hover { background: var(--sidebar-hover); color: #fff; }
        .session-row.active { background: #343541; border-color: #4b5563; color: #fff; }
        .session-meta { font-size: 10px; color: var(--sidebar-muted); margin-top: 2px; }
        aside footer { padding: 10px 12px; border-top: 1px solid #3e3f42; }
        aside footer a { color: #9ea0ff; font-size: 12px; text-decoration: none; }
        aside footer a:hover { text-decoration: underline; }
        main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--main-bg); }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
        .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; }
        .topbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        button.btn {
            border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer;
        }
        button.btn:hover { background: #f9f9f9; }
        button.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        button.btn-primary:hover { filter: brightness(1.05); }
        button.btn-danger { color: #991b1b; border-color: #fecaca; }
        /* Dedicated send control: avoids native :disabled washing out .btn + .btn-primary */
        button.composer-send {
            flex-shrink: 0;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            min-width: 88px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        button.composer-send:hover:not(:disabled) { filter: brightness(1.06); }
        button.composer-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--accent);
            color: #fff;
        }
        button.composer-send.is-busy {
            opacity: 0.75;
            cursor: wait;
            pointer-events: none;
        }
        .messages {
            flex: 1;
            overflow: auto;
            overflow-x: hidden;
            padding: 20px 24px 100px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scrollbar-width: thin;
            scrollbar-color: #94a3b8 #f1f5f9;
        }
        .messages::-webkit-scrollbar { width: 10px; }
        .messages::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .messages::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; border: 2px solid #f1f5f9; }
        .messages::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .bubble { margin-bottom: 14px; max-width: 100%; }
        .bubble.user { text-align: right; }
        .bubble .inner { display: inline-block; text-align: left; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
        .bubble.user .inner { background: var(--user-bubble); }
        .bubble.assistant .inner { background: var(--assistant-bg); }
        .warn-banner { margin: 0 20px 10px; padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: 860px; width: calc(100% - 40px); margin-left: auto; margin-right: auto; }
        .warn-banner.approaching { background: #fffbeb; color: var(--warn); border: 1px solid #fde68a; }
        .warn-banner.critical { background: #fef2f2; color: var(--crit); border: 1px solid #fecaca; }
        .app-notice {
            margin: 0 20px 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.45;
            max-width: 860px;
            width: calc(100% - 40px);
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #991b1b;
        }
        .app-notice-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .app-notice-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
        .app-notice-dismiss {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            text-decoration: underline;
        }
        .app-notice-dismiss:hover { background: rgba(0, 0, 0, 0.06); }
        .composer { border-top: 1px solid var(--border); padding: 12px 20px 16px; background: #fafafa; }
        .composer-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
        .composer textarea {
            flex: 1; min-height: 44px; max-height: 200px; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; font-family: inherit;
        }
        .hint { font-size: 11px; color: #666; margin-top: 6px; max-width: 860px; margin-left: auto; margin-right: auto; }
        .empty-state { color: #666; font-size: 14px; padding: 40px 20px; text-align: center; }
        aside .nav-scroll > .empty-state { color: #a8a8b8; padding: 20px 14px; font-size: 13px; }
        .meta-line { font-size: 12px; color: #555; margin-top: 6px; padding: 0 4px; }
        .bubble-block {
            margin-bottom: 14px;
            max-width: 100%;
            text-align: left;
        }
        .bubble-block .bubble.assistant { margin-bottom: 0; }
        .typing-dots {
            display: inline-block;
            letter-spacing: 3px;
            font-weight: 800;
            color: #64748b;
        }
        .typing-dots span {
            display: inline-block;
            animation: grTypingDot 1.1s ease-in-out infinite;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes grTypingDot {
            0%, 70%, 100% { opacity: 0.2; transform: translateY(0); }
            35% { opacity: 1; transform: translateY(-3px); }
        }
        .assistant-steps {
            margin-top: 8px;
            max-width: min(100%, 560px);
            color: #94a3b8;
        }
        .assistant-steps summary {
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            padding: 2px 0;
        }
        .assistant-steps summary::-webkit-details-marker { display: none; }
        .assistant-steps summary::marker { content: ''; }
        .assistant-steps .steps-chev {
            font-family: ui-monospace, monospace;
            font-size: 11px;
            color: #64748b;
            display: inline-block;
            transition: transform 0.15s ease;
        }
        .assistant-steps[open] .steps-chev { transform: rotate(90deg); }
        .assistant-steps-pre {
            margin: 6px 0 0;
            padding: 8px 10px;
            font-size: 11px;
            line-height: 1.4;
            color: #64748b;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            max-height: 168px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <header>GraphRAG</header>
        <div class="nav-scroll">
            <div class="nav-section-title">Projects</div>
            <div id="project-list" class="empty-state" style="padding:16px;">Loading…</div>
            <div id="session-block" style="display:none;">
                <div class="nav-section-title">Sessions</div>
                <div id="session-list"></div>
            </div>
        </div>
        <footer>
            <a href="{{ url_for('web.index') }}">← Repository upload</a>
        </footer>
    </aside>
    <main>
        <div class="topbar">
            <h1 id="chat-title">Select a project</h1>
            <div class="topbar-actions">
                <button type="button" class="btn btn-primary" id="btn-new-session" disabled>New chat</button>
                <button type="button" class="btn" id="btn-fork-summary" disabled>Summary → new chat</button>
                <button type="button" class="btn btn-danger" id="btn-delete-session" disabled>Delete chat</button>
            </div>
        </div>
        <div id="notice-slot" aria-live="assertive"></div>
        <div id="warn-slot"></div>
        <div class="messages" id="messages">
            <div class="empty-state">Loading…</div>
        </div>
        <div class="composer">
            <div class="composer-inner">
                <textarea id="input" placeholder="Ask about structure, tests, risk…" rows="2" disabled></textarea>
                <button type="button" class="composer-send" id="btn-send" disabled>Send</button>
            </div>
            <p class="hint" id="token-hint"></p>
        </div>
    </main>
</div>
<script>
(function () {
    var API = '/graphrag/api';
    var CHAT_STREAM_HDR = 'X-GraphRAG-Chat-Stream';
    var STREAMING_ASSISTANT = '__GRAPHRAG_STREAM__';
    var initialRun = {{ (initial_run_dir or '')|tojson }};

    var state = {
        projects: [],
        projectGroups: null,
        runDir: null,
        sessionId: null,
        session: null,
        lastContextWarn: 'none',
        lastApproxChars: 0,
        sending: false
    };

    var appNoticeTimer = null;

    function el(id) { return document.getElementById(id); }

    function clearAppNotice() {
        var slot = el('notice-slot');
        if (appNoticeTimer) {
            clearTimeout(appNoticeTimer);
            appNoticeTimer = null;
        }
        if (slot) slot.innerHTML = '';
    }

    function showAppNotice(message) {
        var slot = el('notice-slot');
        if (!slot) return;
        clearAppNotice();
        var wrap = document.createElement('div');
        wrap.className = 'app-notice';
        wrap.setAttribute('role', 'alert');
        var inner = document.createElement('div');
        inner.className = 'app-notice-inner';
        var text = document.createElement('div');
        text.className = 'app-notice-text';
        text.textContent = String(message || 'Something went wrong.');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'app-notice-dismiss';
        btn.setAttribute('aria-label', 'Dismiss');
        btn.textContent = 'Dismiss';
        btn.onclick = clearAppNotice;
        inner.appendChild(text);
        inner.appendChild(btn);
        wrap.appendChild(inner);
        slot.appendChild(wrap);
        try {
            wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch (e1) { /* ignore */ }
        appNoticeTimer = setTimeout(clearAppNotice, 14000);
    }

    function cloneSession(sess) {
        if (!sess) return null;
        try {
            return JSON.parse(JSON.stringify(sess));
        } catch (e) {
            return null;
        }
    }

    function pendingStreamRoot() {
        return document.querySelector('#messages .pending-stream');
    }

    function appendStreamStepLine(line) {
        var root = pendingStreamRoot();
        if (!root || !line) return;
        var pre = root.querySelector('.stream-steps-pre');
        if (!pre) return;
        var cur = pre.textContent;
        var next = cur ? (cur + '\n' + line) : line;
        var rows = next.split('\n');
        if (rows.length > 48) next = rows.slice(-48).join('\n');
        pre.textContent = next;
        pre.scrollTop = pre.scrollHeight;
        var box = el('messages');
        if (box) box.scrollTop = box.scrollHeight;
    }

    function readChatEventStream(res, userTextSnap, sessionSnap) {
        if (!res.body || typeof res.body.getReader !== 'function') {
            return Promise.reject(new Error('No readable stream body.'));
        }
        var reader = res.body.getReader();
        var dec = new TextDecoder();
        var buf = '';
        var terminal = null;
        var streamReplyBuf = '';
        function appendStreamToken(t) {
            if (!t) return;
            streamReplyBuf += t;
            var root = pendingStreamRoot();
            var inner = root ? root.querySelector('.stream-reply-inner') : null;
            if (inner) inner.textContent = streamReplyBuf;
            var box = el('messages');
            if (box) box.scrollTop = box.scrollHeight;
        }
        function handlePayload(obj) {
            if (!obj || typeof obj !== 'object') return false;
            if (obj.type === 'progress') {
                appendStreamStepLine(obj.message || obj.stage || '…');
                return false;
            }
            if (obj.type === 'token') {
                appendStreamToken(obj.text != null ? String(obj.text) : '');
                return false;
            }
            if (obj.type === 'error') {
                state.session = sessionSnap;
                el('input').value = userTextSnap;
                renderMessages();
                showAppNotice(obj.error || 'Request failed');
                terminal = 'error';
                return true;
            }
            if (obj.type === 'complete') {
                state.session = obj.session;
                renderMessages();
                setWarnBanner(obj.context_warn, obj.approx_input_chars);
                refreshSessionList();
                terminal = 'complete';
                return true;
            }
            return false;
        }
        function processBlock(block) {
            var lines = block.split(/\r?\n/);
            for (var j = 0; j < lines.length; j++) {
                var line = lines[j];
                if (line.indexOf('data: ') !== 0) continue;
                var payload;
                try {
                    payload = JSON.parse(line.slice(6));
                } catch (err) {
                    continue;
                }
                if (handlePayload(payload)) return true;
            }
            return false;
        }
        function pump() {
            return reader.read().then(function (result) {
                if (result.value) {
                    buf += dec.decode(result.value, { stream: !result.done });
                }
                if (result.done) {
                    try {
                        buf += dec.decode();
                    } catch (e1) { /* ignore */ }
                }
                var parts = buf.split(/\r?\n\r?\n/);
                buf = parts.pop() || '';
                for (var i = 0; i < parts.length; i++) {
                    if (processBlock(parts[i])) return terminal;
                }
                if (result.done) {
                    if (buf.trim() && processBlock(buf)) return terminal;
                    if (buf.trim()) {
                        console.warn('chat SSE ended with unparsed tail:', buf.slice(0, 400));
                    }
                    return terminal;
                }
                return pump();
            });
        }
        return pump();
    }

    function parseLabelParts(label) {
        var m = (label || '').match(/^(.+)_(\d{8})_(\d{6})$/);
        if (m) return { group: m[1], ymd: m[2], hms: m[3] };
        return { group: label || 'Other', ymd: '', hms: '' };
    }

    function buildProjectGroups(projects) {
        var map = {};
        projects.forEach(function (p) {
            var parts = parseLabelParts(p.label);
            var g = parts.group;
            if (!map[g]) map[g] = [];
            map[g].push({
                run_dir: p.run_dir,
                label: p.label,
                updated_at: p.updated_at || 0,
                ymd: parts.ymd,
                hms: parts.hms
            });
        });
        Object.keys(map).forEach(function (g) {
            map[g].sort(function (a, b) { return (b.updated_at || 0) - (a.updated_at || 0); });
        });
        var keys = Object.keys(map).sort(function (a, b) {
            var maxA = map[a][0] ? map[a][0].updated_at : 0;
            var maxB = map[b][0] ? map[b][0].updated_at : 0;
            if (maxB !== maxA) return maxB - maxA;
            return a.localeCompare(b, undefined, { sensitivity: 'base' });
        });
        return { orderedGroups: keys, byGroup: map };
    }

    function fmtRunTime(ts) {
        if (!ts) return '—';
        var d = new Date(ts * 1000);
        return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function fmtStampLine(ymd, hms) {
        if (!ymd || !hms || ymd.length !== 8 || hms.length !== 6) return '';
        return ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8)
            + ' · ' + hms.slice(0, 2) + ':' + hms.slice(2, 4) + ':' + hms.slice(4, 6);
    }

    function firstRunInSidebarOrder(struct) {
        for (var i = 0; i < struct.orderedGroups.length; i++) {
            var arr = struct.byGroup[struct.orderedGroups[i]];
            if (arr && arr.length) return arr[0].run_dir;
        }
        return null;
    }

    function api(path, opts) {
        opts = opts || {};
        return fetch(API + path, opts).then(function (r) {
            return r.json().then(function (j) { return { okHttp: r.ok, status: r.status, body: j }; });
        });
    }

    function setWarnBanner(level, approx) {
        var slot = el('warn-slot');
        slot.innerHTML = '';
        state.lastContextWarn = level || 'none';
        state.lastApproxChars = approx || 0;
        var hint = el('token-hint');
        hint.textContent = approx ? ('Estimated prompt size (chars): ~' + approx) : '';
        if (level === 'approaching') {
            var d = document.createElement('div');
            d.className = 'warn-banner approaching';
            d.textContent = 'Context is getting large. Start a new chat soon, or use “Summary → new chat” to continue with a fresh session.';
            slot.appendChild(d);
        } else if (level === 'critical') {
            var c = document.createElement('div');
            c.className = 'warn-banner critical';
            c.textContent = 'Context is very large — start a new session now to avoid truncation or failures. You can carry a summary into the new chat.';
            slot.appendChild(c);
        }
    }

    function renderProjects() {
        var list = el('project-list');
        list.innerHTML = '';
        list.removeAttribute('style');
        if (!state.projects.length) {
            list.className = 'empty-state';
            list.style.padding = '16px';
            list.textContent = 'No completed analyses yet. Run a web analysis first.';
            return;
        }
        list.className = '';
        var struct = state.projectGroups || buildProjectGroups(state.projects);
        state.projectGroups = struct;
        struct.orderedGroups.forEach(function (gk) {
            var runs = struct.byGroup[gk];
            var wrap = document.createElement('div');
            wrap.className = 'project-group';
            var title = document.createElement('div');
            title.className = 'project-group-title';
            title.textContent = gk;
            title.title = gk;
            wrap.appendChild(title);
            runs.forEach(function (p) {
                var row = document.createElement('div');
                row.className = 'project-row' + (state.runDir === p.run_dir ? ' active' : '');
                row.title = p.run_dir;
                var pr = document.createElement('div');
                pr.className = 'project-row-primary';
                pr.textContent = fmtRunTime(p.updated_at);
                var sub = document.createElement('div');
                sub.className = 'project-row-date';
                sub.textContent = fmtStampLine(p.ymd, p.hms) || (p.label || p.run_dir).replace(/^web_analysis_/, '');
                row.appendChild(pr);
                row.appendChild(sub);
                row.onclick = function () { selectProject(p.run_dir); };
                wrap.appendChild(row);
            });
            list.appendChild(wrap);
        });
    }

    function renderSessions(sessions) {
        var block = el('session-block');
        var list = el('session-list');
        list.innerHTML = '';
        if (!state.runDir) {
            block.style.display = 'none';
            return;
        }
        block.style.display = 'block';
        (sessions || []).forEach(function (s) {
            var row = document.createElement('div');
            row.className = 'session-row' + (state.sessionId === s.id ? ' active' : '');
            row.textContent = s.title || 'Chat';
            var meta = document.createElement('div');
            meta.className = 'session-meta';
            meta.textContent = (s.message_count || 0) + ' messages';
            row.appendChild(meta);
            row.onclick = function () { selectSession(s.id); };
            list.appendChild(row);
        });
    }

    function renderMessages() {
        var box = el('messages');
        if (!state.runDir) {
            box.innerHTML = '<div class="empty-state">Choose a project from the left.</div>';
            return;
        }
        if (!state.sessionId) {
            box.innerHTML = '<div class="empty-state">Pick a session or click “New chat”.</div>';
            return;
        }
        if (!state.session) {
            box.innerHTML = '<div class="empty-state">Loading…</div>';
            return;
        }
        if (!state.session.messages || !state.session.messages.length) {
            box.innerHTML = '<div class="empty-state">No messages yet. Ask a question below.</div>';
            return;
        }
        box.innerHTML = '';
        state.session.messages.forEach(function (m) {
            if (m.role === 'assistant' && m.content === STREAMING_ASSISTANT) {
                var block = document.createElement('div');
                block.className = 'bubble-block pending-stream';
                var wrap = document.createElement('div');
                wrap.className = 'bubble assistant';
                var inner = document.createElement('div');
                inner.className = 'inner stream-reply-inner';
                inner.setAttribute('aria-live', 'polite');
                inner.innerHTML = '<span class="typing-dots" aria-label="Yazılıyor"><span>.</span><span>.</span><span>.</span></span>';
                wrap.appendChild(inner);
                block.appendChild(wrap);
                var det = document.createElement('details');
                det.className = 'assistant-steps';
                var sum = document.createElement('summary');
                var chev = document.createElement('span');
                chev.className = 'steps-chev';
                chev.setAttribute('aria-hidden', 'true');
                chev.textContent = '>';
                sum.appendChild(chev);
                sum.appendChild(document.createTextNode(' Adımlar'));
                var pre = document.createElement('pre');
                pre.className = 'assistant-steps-pre stream-steps-pre';
                pre.textContent = '';
                det.appendChild(sum);
                det.appendChild(pre);
                block.appendChild(det);
                box.appendChild(block);
                return;
            }
            var wrap = document.createElement('div');
            wrap.className = 'bubble ' + (m.role === 'user' ? 'user' : 'assistant');
            var inner = document.createElement('div');
            inner.className = 'inner';
            inner.textContent = m.content || '';
            wrap.appendChild(inner);
            box.appendChild(wrap);
        });
        box.scrollTop = box.scrollHeight;
    }

    function updateChrome() {
        var hasRun = !!state.runDir;
        el('btn-new-session').disabled = !hasRun;
        el('btn-fork-summary').disabled = !hasRun || !state.sessionId;
        el('btn-delete-session').disabled = !hasRun || !state.sessionId;
        el('input').disabled = !hasRun || !state.sessionId;
        el('btn-send').disabled = !hasRun || !state.sessionId;
        el('chat-title').textContent = state.session
            ? (state.session.title || 'Chat')
            : (state.runDir ? 'Select or create a session' : 'Select a project');
    }

    function selectProject(runDir) {
        clearAppNotice();
        state.runDir = runDir;
        state.sessionId = null;
        state.session = null;
        el('session-list').innerHTML = '';
        el('session-block').style.display = 'none';
        renderProjects();
        updateChrome();
        setWarnBanner('none', 0);
        api('/' + encodeURIComponent(runDir) + '/sessions').then(function (res) {
            if (!res.body.ok) return;
            var sessions = res.body.sessions || [];
            renderSessions(sessions);
            if (!sessions.length) {
                newSession();
            } else if (!state.sessionId) {
                selectSession(sessions[0].id);
            }
        });
        renderMessages();
    }

    function selectSession(sessionId) {
        if (!state.runDir) return;
        state.sessionId = sessionId;
        state.session = null;
        renderMessages();
        api('/' + encodeURIComponent(state.runDir) + '/sessions/' + encodeURIComponent(sessionId)).then(function (res) {
            if (!res.body.ok) {
                state.sessionId = null;
                state.session = null;
                updateChrome();
                renderMessages();
                return;
            }
            state.session = res.body.session;
            api('/' + encodeURIComponent(state.runDir) + '/sessions').then(function (r2) {
                if (r2.body.ok) renderSessions(r2.body.sessions);
            });
            renderMessages();
            updateChrome();
            setWarnBanner('none', 0);
        });
    }

    function refreshSessionList() {
        if (!state.runDir) return;
        api('/' + encodeURIComponent(state.runDir) + '/sessions').then(function (res) {
            if (res.body.ok) renderSessions(res.body.sessions);
        });
    }

    function newSession() {
        if (!state.runDir) return;
        api('/' + encodeURIComponent(state.runDir) + '/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: 'New chat' })
        }).then(function (res) {
            if (!res.body.ok) {
                showAppNotice(res.body.error || 'Failed');
                return;
            }
            refreshSessionList();
            selectSession(res.body.session.id);
        });
    }

    function forkSummary() {
        if (!state.runDir || !state.sessionId) return;
        api('/' + encodeURIComponent(state.runDir) + '/sessions/fork', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from_session_id: state.sessionId, title: 'Continued chat' })
        }).then(function (res) {
            if (!res.body.ok) {
                showAppNotice(res.body.error || 'Fork failed');
                return;
            }
            refreshSessionList();
            selectSession(res.body.session.id);
        });
    }

    function deleteSession() {
        if (!state.runDir || !state.sessionId) return;
        if (!confirm('Delete this chat session?')) return;
        api('/' + encodeURIComponent(state.runDir) + '/sessions/' + encodeURIComponent(state.sessionId), { method: 'DELETE' }).then(function (res) {
            if (!res.body.ok) {
                showAppNotice(res.body.error || 'Delete failed');
                return;
            }
            state.sessionId = null;
            state.session = null;
            refreshSessionList();
            renderMessages();
            updateChrome();
            setWarnBanner('none', 0);
        });
    }

    function send() {
        var text = (el('input').value || '').trim();
        if (!text || !state.runDir || !state.sessionId || state.sending) return;
        if (!state.session) return;
        clearAppNotice();
        var btn = el('btn-send');
        state.sending = true;
        btn.classList.add('is-busy');
        var snap = cloneSession(state.session);
        var baseMsgs = state.session.messages ? state.session.messages.slice() : [];
        state.session = Object.assign({}, state.session, {
            messages: baseMsgs.concat([
                { role: 'user', content: text },
                { role: 'assistant', content: STREAMING_ASSISTANT }
            ])
        });
        el('input').value = '';
        renderMessages();

        var msgUrl =
            API +
            '/' +
            encodeURIComponent(state.runDir) +
            '/sessions/' +
            encodeURIComponent(state.sessionId) +
            '/message';
        var headers = { 'Content-Type': 'application/json' };
        headers[CHAT_STREAM_HDR] = '1';

        fetch(msgUrl, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ message: text })
        })
            .then(function (res) {
                var ct = (res.headers.get('Content-Type') || '').toLowerCase();
                if (ct.indexOf('text/event-stream') !== -1) {
                    if (!res.ok) {
                        state.session = snap;
                        el('input').value = text;
                        renderMessages();
                        showAppNotice('Chat stream failed (HTTP ' + res.status + ').');
                        return;
                    }
                    return readChatEventStream(res, text, snap).then(function (term) {
                        if (term !== 'complete' && term !== 'error') {
                            state.session = snap;
                            el('input').value = text;
                            renderMessages();
                            showAppNotice(
                                'The reply stream ended before a final answer. The chat model may still be running, or the connection timed out. Check that Ollama (or your API) is reachable, then try again or raise GRAPHRAG_CHAT_TIMEOUT_S in .env.'
                            );
                        }
                    });
                }
                return res.json().then(function (body) {
                    if (!res.ok || !body.ok) {
                        state.session = snap;
                        el('input').value = text;
                        renderMessages();
                        showAppNotice((body && body.error) || 'Request failed (' + res.status + ')');
                        return;
                    }
                    state.session = body.session;
                    renderMessages();
                    setWarnBanner(body.context_warn, body.approx_input_chars);
                    refreshSessionList();
                });
            })
            .catch(function (e) {
                state.session = snap;
                el('input').value = text;
                renderMessages();
                showAppNotice('Network: ' + e);
            })
            .then(function () {
                state.sending = false;
                btn.classList.remove('is-busy');
            });
    }

    el('btn-new-session').onclick = newSession;
    el('btn-fork-summary').onclick = forkSummary;
    el('btn-delete-session').onclick = deleteSession;
    el('btn-send').onclick = send;
    el('input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!state.sending) send();
        }
    });

    api('/projects').then(function (res) {
        if (!res.body.ok) {
            el('project-list').textContent = 'Could not load projects.';
            return;
        }
        state.projects = res.body.projects || [];
        state.projectGroups = buildProjectGroups(state.projects);
        renderProjects();
        var pick = (initialRun && state.projects.some(function (p) { return p.run_dir === initialRun; }))
            ? initialRun
            : firstRunInSidebarOrder(state.projectGroups);
        if (pick) {
            selectProject(pick);
        }
        updateChrome();
    });
})();
</script>
</body>
</html>
